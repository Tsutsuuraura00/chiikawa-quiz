<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제초 모의고사 · 공지 퀴즈 10문제</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF6EA; --surface:#FFFFFF; --ink:#2C3829; --muted:#66745F;
  --grass:#4F9441; --grass-soft:#DCEED4; --pink:#F4B3C2; --pink-soft:#FCE8ED;
  --stamp:#D23F5A; --line:#CFE0C6; --wrong:#B5462F; --wrong-soft:#FBE6E0;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#172014; --surface:#212C1E; --ink:#E6EFE1; --muted:#A3B39B;
    --grass:#8CCB7B; --grass-soft:#2C3D27; --pink:#F2A7B8; --pink-soft:#3A2A2F;
    --stamp:#FF7590; --line:#34452F; --wrong:#FF9A82; --wrong-soft:#3B2622;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#172014; --surface:#212C1E; --ink:#E6EFE1; --muted:#A3B39B;
  --grass:#8CCB7B; --grass-soft:#2C3D27; --pink:#F2A7B8; --pink-soft:#3A2A2F;
  --stamp:#FF7590; --line:#34452F; --wrong:#FF9A82; --wrong-soft:#3B2622;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:17px; line-height:1.65; min-height:100%;
}
main{max-width:560px; margin:0 auto; padding:32px 20px 48px}
h1,h2{font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif; font-weight:400}
.grass{height:22px; margin-bottom:20px; color:var(--grass)}
.grass svg{display:block; width:100%; height:100%}
h1{font-size:2.4rem; line-height:1.15; margin:0 0 10px}
.lead{color:var(--muted); margin:0 0 28px}
.sheet{background:var(--surface); border:2px solid var(--line); border-radius:18px; padding:24px}
.field + .field{margin-top:24px}
.label{display:block; font-size:.95rem; color:var(--muted); margin-bottom:8px}
input[type=text]{
  width:100%; font:inherit; color:var(--ink); background:var(--bg);
  border:2px solid var(--line); border-radius:12px; padding:12px 14px;
}
input[type=text]:focus{outline:none; border-color:var(--grass)}
.hint{font-size:.88rem; color:var(--muted); margin:10px 0 0}

/* 등급 선택 */
.levels{display:grid; grid-template-columns:1fr 1fr; gap:10px; border:0; padding:0; margin:0}
.levels legend{padding:0}
.level{position:relative}
.level input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer}
.level span{
  display:block; height:100%; padding:12px 14px; border:2px solid var(--line);
  border-radius:14px; background:var(--bg); cursor:pointer;
}
.level b{display:block; font-family:"Jua",sans-serif; font-weight:400; font-size:1.15rem; line-height:1.3}
.level small{display:block; font-size:.85rem; color:var(--muted); line-height:1.45; margin-top:4px}
.level input:checked + span{border-color:var(--grass); background:var(--grass-soft)}
.level input:focus-visible + span{outline:3px solid var(--pink); outline-offset:3px}

.btn{
  display:inline-block; font-family:"Jua",sans-serif; font-size:1.15rem;
  background:var(--grass); color:var(--surface); border:0; border-radius:999px;
  padding:12px 26px; margin-top:24px; cursor:pointer;
}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.link:focus-visible{outline:3px solid var(--pink); outline-offset:3px}
.link{background:none; border:0; padding:0; font:inherit; font-size:.92rem; color:var(--muted); text-decoration:underline; cursor:pointer; margin-top:16px}
.qmeta{font-size:.9rem; color:var(--muted); margin:0 0 6px}
.qtext{font-family:"Jua",sans-serif; font-size:1.45rem; line-height:1.4; margin:0 0 20px}
.opts{display:grid; gap:10px}
.opt{
  text-align:left; font:inherit; color:var(--ink); background:var(--bg);
  border:2px solid var(--line); border-radius:14px; padding:13px 16px; cursor:pointer;
}
.opt:hover:not(:disabled){border-color:var(--grass)}
.opt:disabled{cursor:default}
.opt.is-right{border-color:var(--grass); background:var(--grass-soft)}
.opt.is-picked-wrong{border-color:var(--wrong); background:var(--wrong-soft)}
.feedback{margin-top:20px; padding:16px 18px; border-radius:14px; background:var(--wrong-soft); border-left:5px solid var(--wrong)}
.feedback h2{font-size:1.25rem; margin:0 0 4px; color:var(--wrong)}
.feedback p{margin:0}

/* 합격증 */
.pass{position:relative; background:var(--surface); border:2px solid var(--grass); border-radius:18px; padding:26px 24px 24px; overflow:hidden}
.pass h2{font-size:1.9rem; margin:0 0 22px; padding-right:100px}
.pass .sub{color:var(--muted); margin:0 0 22px}
.rows{display:grid; grid-template-columns:auto 1fr; gap:8px 18px; margin:0}
.rows dt{color:var(--muted); font-size:.92rem}
.rows dd{margin:0; font-weight:700}
.rows dd.code{font-family:"Jua",sans-serif; font-size:1.3rem; letter-spacing:.12em; color:var(--grass)}
.solved{margin-top:20px; padding-top:16px; border-top:2px dashed var(--line); font-size:.95rem}
.solved p{margin:0}
.stamp{
  position:absolute; top:18px; right:18px; width:92px; height:92px; border-radius:50%;
  border:4px solid var(--stamp); color:var(--stamp);
  display:grid; place-items:center; transform:rotate(-14deg);
  font-family:"Jua",sans-serif; font-size:1.7rem; line-height:1; text-align:center;
  animation:press .45s cubic-bezier(.2,1.6,.4,1) both;
}
.stamp small{display:block; font-size:.62rem; letter-spacing:.05em; margin-top:2px}
@keyframes press{from{transform:rotate(-14deg) scale(1.8); opacity:0} to{transform:rotate(-14deg) scale(1); opacity:.92}}
.howto{margin-top:18px; padding:14px 16px; border-radius:14px; background:var(--pink-soft); font-size:.95rem}
.howto p{margin:0}
.howto p + p{margin-top:10px}
.event input[type=text]{margin-top:4px}
a.btn{text-decoration:none}
.apply{margin-top:18px; background:var(--surface); border:2px solid var(--line); border-radius:18px; padding:20px}
.apply h3{font-family:"Jua",sans-serif; font-weight:400; font-size:1.2rem; margin:0 0 8px}
.apply p{margin:0 0 12px; font-size:.95rem; color:var(--muted)}
.line{display:block; width:100%; font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:.92rem; color:var(--ink);
  background:var(--bg); border:2px dashed var(--line); border-radius:12px; padding:12px 14px; word-break:break-all; user-select:all}
.apply .btn{margin-top:14px}
[hidden]{display:none !important}
@media (prefers-reduced-motion: reduce){.stamp{animation:none; opacity:.92}}
@media (max-width:420px){
  h1{font-size:2rem}
  .stamp{width:76px; height:76px; font-size:1.4rem; top:14px; right:14px}
  .pass h2{padding-right:80px}
}

/* 모의고사 전용 */
.levels{grid-template-columns:1fr}
.progress{height:10px; border-radius:999px; background:var(--line); overflow:hidden; margin:0 0 16px}
.progress i{display:block; height:100%; width:0; background:var(--grass); border-radius:999px; transition:width .3s ease}
.topline{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.feedback.ok{background:var(--grass-soft); border-left-color:var(--grass)}
.feedback.ok h2{color:var(--grass)}
.feedback{position:relative}
.feedback.has-sticker{padding-right:112px; min-height:112px}
.sticker{position:absolute; right:10px; bottom:8px; width:92px; height:92px; object-fit:contain; animation:hop .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes hop{from{transform:translateY(16px) rotate(-8deg) scale(.6); opacity:0} to{transform:none; opacity:1}}
.half h2{font-family:"Jua",sans-serif; font-weight:400; font-size:1.8rem; margin:0 0 4px}
.half p{margin:0; color:var(--muted)}
@media (prefers-reduced-motion: reduce){.sticker{animation:none}}
.score{font-family:"Jua",sans-serif; font-size:4.2rem; line-height:1; color:var(--grass); margin:4px 0 6px}
.score small{font-size:1.6rem; color:var(--muted)}
.title{font-family:"Jua",sans-serif; font-size:1.5rem; margin:0 0 6px}
.dots{display:flex; gap:6px; flex-wrap:wrap; margin:16px 0 0}
.dots span{width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:.75rem; font-weight:700; color:var(--surface)}
.dots .o{background:var(--grass)} .dots .x{background:var(--wrong)}
.review{margin-top:18px}
.review h3{font-family:"Jua",sans-serif; font-weight:400; font-size:1.25rem; margin:0 0 10px}
.review ol{margin:0; padding-left:1.3em; display:grid; gap:12px}
.review li p{margin:0}
.review .a{color:var(--grass); font-weight:700}
.review .mine{color:var(--wrong); font-size:.92rem}
.review .e{color:var(--muted); font-size:.92rem}
.actions{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.actions .btn{margin-top:20px}
.btn.ghost{background:transparent; color:var(--grass); border:2px solid var(--grass)}
a.link{color:var(--muted)}
.pic{margin:0 0 18px; border-radius:14px; overflow:hidden; background:var(--grass-soft); aspect-ratio:16/9}
.pic img{display:block; width:100%; height:100%; object-fit:cover; animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.pic figcaption{position:absolute; left:-9999px}
@keyframes pop{from{transform:scale(.92); opacity:0} to{transform:scale(1); opacity:1}}
@media (prefers-reduced-motion: reduce){.progress i{transition:none} .pic img{animation:none}}
</style>
</head>
<body>
<main>
  <div class="grass" aria-hidden="true">
    <svg viewBox="0 0 520 22" preserveAspectRatio="none"><path fill="currentColor" d="M0 22 L6 8 L10 22 L16 4 L22 22 L28 10 L32 22 L40 2 L46 22 L52 12 L58 22 L64 6 L70 22 L76 11 L82 22 L90 3 L96 22 L102 9 L108 22 L116 5 L122 22 L128 12 L134 22 L142 2 L148 22 L154 10 L160 22 L168 6 L174 22 L180 13 L186 22 L194 4 L200 22 L206 9 L212 22 L220 3 L226 22 L232 11 L238 22 L246 6 L252 22 L258 12 L264 22 L272 2 L278 22 L284 9 L290 22 L298 5 L304 22 L310 12 L316 22 L324 3 L330 22 L336 10 L342 22 L350 6 L356 22 L362 13 L368 22 L376 4 L382 22 L388 9 L394 22 L402 2 L408 22 L414 11 L420 22 L428 6 L434 22 L440 12 L446 22 L454 3 L460 22 L466 9 L472 22 L480 5 L486 22 L492 11 L498 22 L506 4 L512 22 L520 10 L520 22 Z"/></svg>
  </div>

  <section id="start">
    <h1>제초 모의고사</h1>
    <p class="lead">카페 공지에서 무작위로 10문제가 나와요. 등업과 상관없이 재미로 풀어 보세요. 몇 문제나 맞힐 수 있을까요?</p>
    <div class="sheet">
      <fieldset class="levels" id="ranges">
        <legend class="label">출제 범위</legend>
      </fieldset>
      <button class="btn" id="startBtn">10문제 풀기</button>
    </div>
  </section>

  <section id="quiz" hidden>
    <div class="sheet">
      <div class="progress" aria-hidden="true"><i id="bar"></i></div>
      <div class="topline"><p class="qmeta" id="qmeta"></p><p class="qmeta" id="qscore"></p></div>
      <p class="qtext" id="qtext"></p>
      <div class="opts" id="opts" role="group" aria-labelledby="qtext"></div>
      <div class="feedback" id="feedback" hidden role="status">
        <h2 id="fbTitle"></h2>
        <p id="explain"></p>
        <img class="sticker" id="fbSticker" alt="" hidden>
      </div>
      <button class="btn" id="nextBtn" hidden>다음 문제</button>
    </div>
  </section>

  <section id="half" hidden>
    <div class="sheet half">
      <figure class="pic"><img id="hPic" alt="쉬어가기 장면"></figure>
      <h2>절반 왔어요!</h2>
      <p id="hMsg"></p>
      <button class="btn" id="contBtn">계속 풀기</button>
    </div>
  </section>

  <section id="result" hidden>
    <div class="sheet">
      <figure class="pic"><img id="rPic" alt="결과와 함께 나오는 한 장면"></figure>
      <p class="qmeta" id="rRange"></p>
      <p class="score"><span id="rScore"></span><small> / 10</small></p>
      <p class="title" id="rTitle"></p>
      <p class="lead" id="rMsg" style="margin:0"></p>
      <div class="dots" id="rDots" aria-hidden="true"></div>
    </div>
    <div class="sheet review" id="review" hidden>
      <h3>틀린 문제 다시 보기</h3>
      <ol id="reviewList"></ol>
    </div>
    <div class="apply event" id="event" hidden>
      <h3>만점! 이벤트 응모 자격을 얻었어요</h3>
      <p>카페 닉네임을 입력하면 응모 코드가 나와요. 구글폼에 닉네임과 응모 코드를 적어 주시면 상품 추첨에 참여됩니다.</p>
      <input id="evNick" type="text" maxlength="30" autocomplete="off" placeholder="카페 닉네임 그대로 입력">
      <button class="btn" id="evBtn" type="button" disabled>응모 코드 받기</button>
      <div id="evOut" hidden>
        <p style="margin:18px 0 8px">응모 코드</p>
        <code class="line" id="evCode"></code>
        <div class="actions">
          <button class="btn" id="evCopy" type="button">코드 복사</button>
          <a class="btn ghost" id="evForm" href="#" target="_blank" rel="noopener" hidden>구글폼으로 응모하기</a>
        </div>
        <p style="margin:12px 0 0">응모 코드는 입력한 닉네임에 맞춰 만들어져요. 구글폼에도 같은 닉네임을 적어 주세요.</p>
      </div>
    </div>
    <p class="hint" id="evHint" hidden></p>
    <div class="actions">
      <button class="btn" id="againBtn">다시 풀기</button>
      <button class="btn ghost" id="homeBtn">범위 바꾸기</button>
    </div>
  </section>
</main>

async function makeEventCode(name){

["c","카페 거래와 관련해 운영진이 밝힌 구조적 한계는?","거래 내역을 운영자가 모니터링할 수 없다",["거래 게시판이 없다","해외 거래가 불가하다","현금 거래만 가능하다"],"그래서 충분한 대화와 인증 후 거래하라고 안내합니다."]
];

const $ = id => document.getElementById(id);
let range = 0, set = [], idx = 0, score = 0, marks = [], wrongs = [], locked = false;

RANGES.forEach((r, i) => {
  const l = document.createElement("label");
  l.className = "level";
  l.innerHTML = `<input type="radio" name="range" value="${i}"${i===0?" checked":""}><span><b>${r.name}</b><small>${r.desc}</small></span>`;
  $("ranges").appendChild(l);
});

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function show(id){ ["start","quiz","half","result"].forEach(s => $(s).hidden = s !== id); window.scrollTo({top:0}); }

function begin(){
  const pool = Q.filter(q => RANGES[range].pools.includes(q[0]));
  set = shuffle(pool).slice(0, COUNT); idx = 0; score = 0; marks = []; wrongs = [];
  show("quiz"); render();
}
$("startBtn").addEventListener("click", () => {
  range = +document.querySelector("input[name=range]:checked").value; begin();
});

function render(){
  locked = false;
  const [, q, right, wr] = set[idx];
  $("bar").style.width = `${idx / COUNT * 100}%`;
  $("qmeta").textContent = `${idx + 1} / ${COUNT}`;
  $("qscore").textContent = `맞힌 문제 ${score}`;
  $("qtext").textContent = q;
  $("feedback").hidden = true; $("nextBtn").hidden = true;
  const box = $("opts"); box.innerHTML = "";
  shuffle([right, ...wr]).forEach(text => {
    const b = document.createElement("button");
    b.className = "opt"; b.type = "button"; b.textContent = text;
    b.addEventListener("click", () => pick(b, text));
    box.appendChild(b);
  });
}

function pick(btn, text){
  if(locked) return; locked = true;
  const [, q, right, , exp] = set[idx];
  const all = [...$("opts").children];
  all.forEach(b => b.disabled = true);
  all.find(b => b.textContent === right).classList.add("is-right");
  const ok = text === right;
  if(ok){ score++; } else { btn.classList.add("is-picked-wrong"); wrongs.push({q, right, mine:text, exp}); }
  marks.push(ok);
  $("qscore").textContent = `맞힌 문제 ${score}`;
  $("feedback").className = "feedback" + (ok ? " ok" : "");
  $("fbTitle").textContent = ok ? "정답이에요!" : "아쉬워요";
  const sk = $("fbSticker");
  if(ok){ sk.src = STICKERS[draw(stickQ, STICKERS, -1)]; sk.hidden = false; $("feedback").classList.add("has-sticker"); }
  else { sk.hidden = true; sk.removeAttribute("src"); }
  $("explain").textContent = exp;
  $("feedback").hidden = false;
  $("nextBtn").textContent = idx === COUNT - 1 ? "결과 보기" : "다음 문제";
  $("nextBtn").hidden = false; $("nextBtn").focus();
  $("bar").style.width = `${(idx + 1) / COUNT * 100}%`;
}

$("nextBtn").addEventListener("click", () => {
  idx++;
  if(idx === Math.floor(COUNT / 2)){ halfway(); return; }
  if(idx < COUNT) render(); else finish();
});

function halfway(){
  const pi = draw(picQ, PICS, lastPic); lastPic = pi; $("hPic").src = PICS[pi];
  $("hMsg").textContent = `${COUNT}문제 중 ${idx}문제를 풀었고, ${score}문제 맞혔어요. 남은 문제도 힘내요!`;
  show("half"); $("contBtn").focus();
}
$("contBtn").addEventListener("click", () => { show("quiz"); render(); });

function finish(){
  const tiers = [
    [10, "토벌 마스터", "공지를 전부 외우셨네요! 운영진도 놀랄 실력이에요."],
    [8,  "베테랑 제초사", "거의 다 맞혔어요. 틀린 문제만 한 번 더 보면 완벽해요."],
    [5,  "견습 제초사", "기본은 탄탄해요. 헷갈린 부분은 공지를 한 번 더 읽어 보세요."],
    [0,  "풀숲에서 길을 잃었어요", "괜찮아요! 공지를 천천히 읽고 다시 도전해 보세요."]
  ];
  const [, t, m] = tiers.find(([min]) => score >= min);
  const pi = draw(picQ, PICS, lastPic); lastPic = pi; $("rPic").src = PICS[pi];
  $("rRange").textContent = `${RANGES[range].name} · 결과`;
  $("rScore").textContent = score;
  $("rTitle").textContent = t;
  $("rMsg").textContent = m;
  $("rDots").innerHTML = marks.map((o, i) => `<span class="${o ? "o" : "x"}">${i + 1}</span>`).join("");
  const list = $("reviewList"); list.innerHTML = "";
  wrongs.forEach(w => {
    const li = document.createElement("li");
    const p1 = document.createElement("p"); p1.textContent = w.q;
    const p2 = document.createElement("p"); p2.className = "a"; p2.textContent = "정답: " + w.right;
    const p3 = document.createElement("p"); p3.className = "mine"; p3.textContent = "내 답: " + w.mine;
    const p4 = document.createElement("p"); p4.className = "e"; p4.textContent = w.exp;
    li.append(p1, p2, p3, p4); list.appendChild(li);
  });
  $("review").hidden = wrongs.length === 0;
  const perfect = score === COUNT && range === 0;
  $("event").hidden = !perfect; $("evOut").hidden = true; $("evNick").value = ""; $("evBtn").disabled = true;
  $("evHint").hidden = perfect;
  $("evHint").textContent = range === 0 ? "전체 공지 범위에서 10문제를 모두 맞히면 이벤트 응모 코드를 받을 수 있어요." : "이벤트 응모 코드는 전체 공지 범위에서 10문제를 모두 맞히면 받을 수 있어요.";
  show("result");
}

$("againBtn").addEventListener("click", begin);
$("evNick").addEventListener("input", () => { $("evBtn").disabled = !$("evNick").value.trim(); });
$("evBtn").addEventListener("click", async () => {
  $("evCode").textContent = await makeEventCode($("evNick").value.trim());
  if(FORM_URL){ $("evForm").href = FORM_URL; $("evForm").hidden = false; }
  $("evOut").hidden = false;
});
$("evCopy").addEventListener("click", async () => {
  const b = $("evCopy");
  try{ await navigator.clipboard.writeText($("evCode").textContent); b.textContent = "복사했어요"; }
  catch(e){ const r = document.createRange(); r.selectNodeContents($("evCode")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent = "길게 눌러 복사해 주세요"; }
  setTimeout(() => { b.textContent = "코드 복사"; }, 2500);
});
$("homeBtn").addEventListener("click", () => show("start"));
</script>
