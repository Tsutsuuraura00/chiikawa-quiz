<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제초 검정 · 등업 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF6EA; --surface:#FFFFFF; --ink:#2C3829; --muted:#66745F;
  --grass:#4F9441; --grass-soft:#DCEED4; --pink:#F4B3C2; --pink-soft:#FCE8ED;
  --stamp:#D23F5A; --line:#CFE0C6; --wrong:#B5462F; --wrong-soft:#FBE6E0;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#172014; --surface:#212C1E; --ink:#E6EFE1; --muted:#A3B39B;
    --grass:#8CCB7B; --grass-soft:#2C3D27; --pink:#F2A7B8; --pink-soft:#3A2A2F;
    --stamp:#FF7590; --line:#34452F; --wrong:#FF9A82; --wrong-soft:#3B2622;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#172014; --surface:#212C1E; --ink:#E6EFE1; --muted:#A3B39B;
  --grass:#8CCB7B; --grass-soft:#2C3D27; --pink:#F2A7B8; --pink-soft:#3A2A2F;
  --stamp:#FF7590; --line:#34452F; --wrong:#FF9A82; --wrong-soft:#3B2622;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:17px; line-height:1.65; min-height:100%;
}
main{max-width:560px; margin:0 auto; padding:32px 20px 48px}
h1,h2,.display{font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif; font-weight:400}
.grass{height:22px; margin-bottom:20px; color:var(--grass)}
.grass svg{display:block; width:100%; height:100%}
h1{font-size:2.4rem; line-height:1.15; margin:0 0 10px}
.lead{color:var(--muted); margin:0 0 28px}
.sheet{background:var(--surface); border:2px solid var(--line); border-radius:18px; padding:24px}
label{display:block; font-size:.95rem; color:var(--muted); margin-bottom:8px}
input[type=text]{
  width:100%; font:inherit; color:var(--ink); background:var(--bg);
  border:2px solid var(--line); border-radius:12px; padding:12px 14px;
}
input[type=text]:focus{outline:none; border-color:var(--grass)}
.hint{font-size:.88rem; color:var(--muted); margin:10px 0 0}
.btn{
  display:inline-block; font-family:"Jua",sans-serif; font-size:1.15rem;
  background:var(--grass); color:var(--surface); border:0; border-radius:999px;
  padding:12px 26px; margin-top:20px; cursor:pointer;
}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--pink); outline-offset:3px}
.qmeta{font-size:.9rem; color:var(--muted); margin:0 0 6px}
.qtext{font-family:"Jua",sans-serif; font-size:1.45rem; line-height:1.4; margin:0 0 20px}
.opts{display:grid; gap:10px}
.opt{
  text-align:left; font:inherit; color:var(--ink); background:var(--bg);
  border:2px solid var(--line); border-radius:14px; padding:13px 16px; cursor:pointer;
}
.opt:hover:not(:disabled){border-color:var(--grass)}
.opt:disabled{cursor:default}
.opt.is-right{border-color:var(--grass); background:var(--grass-soft)}
.opt.is-picked-wrong{border-color:var(--wrong); background:var(--wrong-soft)}
.feedback{margin-top:20px; padding:16px 18px; border-radius:14px; background:var(--wrong-soft); border-left:5px solid var(--wrong)}
.feedback h2{font-size:1.25rem; margin:0 0 4px; color:var(--wrong)}
.feedback p{margin:0}

/* pass card */
.pass{position:relative; background:var(--surface); border:2px solid var(--grass); border-radius:18px; padding:26px 24px 24px; overflow:hidden}
.pass h2{font-size:1.9rem; margin:0 0 4px}
.pass .sub{color:var(--muted); margin:0 0 22px}
.rows{display:grid; grid-template-columns:auto 1fr; gap:8px 18px; margin:0}
.rows dt{color:var(--muted); font-size:.92rem}
.rows dd{margin:0; font-weight:700}
.rows dd.code{font-family:"Jua",sans-serif; font-size:1.3rem; letter-spacing:.12em; color:var(--grass)}
.solved{margin-top:20px; padding-top:16px; border-top:2px dashed var(--line); font-size:.95rem}
.solved p{margin:0}
.stamp{
  position:absolute; top:18px; right:18px; width:92px; height:92px; border-radius:50%;
  border:4px solid var(--stamp); color:var(--stamp);
  display:grid; place-items:center; transform:rotate(-14deg);
  font-family:"Jua",sans-serif; font-size:1.7rem; line-height:1; text-align:center;
  animation:press .45s cubic-bezier(.2,1.6,.4,1) both;
}
.stamp small{display:block; font-size:.62rem; letter-spacing:.05em; margin-top:2px}
@keyframes press{from{transform:rotate(-14deg) scale(1.8); opacity:0} to{transform:rotate(-14deg) scale(1); opacity:.92}}
.howto{margin-top:18px; padding:14px 16px; border-radius:14px; background:var(--pink-soft); font-size:.95rem}
.howto p{margin:0}
[hidden]{display:none !important}
@media (prefers-reduced-motion: reduce){.stamp{animation:none; opacity:.92}}
@media (max-width:420px){
  h1{font-size:2rem}
  .stamp{width:76px; height:76px; font-size:1.4rem; top:14px; right:14px}
  .pass h2{padding-right:80px}
}
</style>
</head>
<body>
<main>
  <div class="grass" aria-hidden="true">
    <svg viewBox="0 0 520 22" preserveAspectRatio="none"><path fill="currentColor" d="M0 22 L6 8 L10 22 L16 4 L22 22 L28 10 L32 22 L40 2 L46 22 L52 12 L58 22 L64 6 L70 22 L76 11 L82 22 L90 3 L96 22 L102 9 L108 22 L116 5 L122 22 L128 12 L134 22 L142 2 L148 22 L154 10 L160 22 L168 6 L174 22 L180 13 L186 22 L194 4 L200 22 L206 9 L212 22 L220 3 L226 22 L232 11 L238 22 L246 6 L252 22 L258 12 L264 22 L272 2 L278 22 L284 9 L290 22 L298 5 L304 22 L310 12 L316 22 L324 3 L330 22 L336 10 L342 22 L350 6 L356 22 L362 13 L368 22 L376 4 L382 22 L388 9 L394 22 L402 2 L408 22 L414 11 L420 22 L428 6 L434 22 L440 12 L446 22 L454 3 L460 22 L466 9 L472 22 L480 5 L486 22 L492 11 L498 22 L506 4 L512 22 L520 10 L520 22 Z"/></svg>
  </div>

  <!-- 시작 -->
  <section id="start">
    <h1>제초 검정</h1>
    <p class="lead">카페 공지를 읽으셨다면 쉽게 풀 수 있어요. 무작위로 나오는 한 문제를 맞히면 합격입니다.</p>
    <div class="sheet">
      <label for="nick">카페 닉네임</label>
      <input id="nick" type="text" maxlength="30" autocomplete="off" placeholder="등업 신청할 닉네임 그대로 입력">
      <p class="hint">합격증에 이 닉네임이 표시돼요. 등업 신청 닉네임과 같아야 확인이 가능합니다.</p>
      <button class="btn" id="startBtn" disabled>시험 보기</button>
    </div>
  </section>

  <!-- 문제 -->
  <section id="quiz" hidden>
    <div class="sheet">
      <p class="qmeta" id="qmeta"></p>
      <p class="qtext" id="qtext"></p>
      <div class="opts" id="opts" role="group" aria-labelledby="qtext"></div>
      <div class="feedback" id="feedback" hidden role="alert">
        <h2>틀렸어요</h2>
        <p id="explain"></p>
      </div>
      <button class="btn" id="retryBtn" hidden>다른 문제로 다시 풀기</button>
    </div>
  </section>

  <!-- 합격 -->
  <section id="passed" hidden>
    <div class="pass">
      <div class="stamp" aria-hidden="true"><div>합격<small>제초 검정</small></div></div>
      <h2>합격했어요</h2>
      <p class="sub">이 화면을 캡처해 주세요.</p>
      <dl class="rows">
        <dt>닉네임</dt><dd id="pNick"></dd>
        <dt>합격 일시</dt><dd id="pTime"></dd>
        <dt>도전 횟수</dt><dd id="pTries"></dd>
        <dt>확인 번호</dt><dd class="code" id="pCode"></dd>
      </dl>
      <div class="solved">
        <p><strong>맞힌 문제</strong></p>
        <p id="pQ"></p>
        <p>정답: <span id="pA"></span></p>
      </div>
    </div>
    <div class="howto">
      <p>캡처한 화면을 등업 신청글에 첨부하면 운영진이 확인 후 등업해 드립니다. 캡처 전에 닉네임이 맞는지 꼭 확인해 주세요.</p>
    </div>
  </section>
</main>

<script>
// [문제, 정답, [오답 3개], 해설]
const Q = [
["판매글에 가격을 기재하지 않았을 때의 제재는?","활동 정지 1일",["경고 1회","활동 정지 7일","제재 없음"],"가격 미기재는 활동 정지 1일입니다."],
["엔화 물품의 판매·공구 가격 기준은 최대 몇 배인가요?","x10",["x9","x11","x12"],"엔화는 최대 x10입니다."],
["위안화 물품의 가격 기준은 최대 몇 배인가요?","x230",["x200","x210","x250"],"위안화는 최대 x230입니다."],
["팬아트 게시판에 게시할 수 없는 것은?","AI 생성 일러스트",["본인이 직접 그린 그림","원작자 허락과 출처를 기재한 타인의 작품","농담곰 팬아트"],"팬아트 게시판에는 AI 생성 일러스트를 올릴 수 없습니다."],
["주문은 완료했지만 아직 실물을 받지 않은 물품을 나누려면 어디에 올려야 하나요?","공동구매·대리구매 진행 게시판 [소분합니다]",["판매 게시판 [판매중]","무료 나눔 게시판","교환 게시판"],"미수령 물품은 소분으로 분류되어 공동구매·대리구매 진행 게시판에 [소분합니다] 말머리로 올립니다."],
["게시판 도배 기준은?","5분 이내에 3개 초과의 글 작성",["10분 이내에 3개 초과의 글 작성","5분 이내에 5개 초과의 글 작성","1시간 이내에 10개 초과의 글 작성"],"5분 이내에 3개를 넘게 쓰면 도배로 경고 1회입니다."],
["가품 판매 시 제재는?","영구 탈퇴",["활동 정지 7일","경고 2회","활동 정지 30일"],"가품 판매는 영구 탈퇴 사유입니다."],
["굿즈 자랑 게시판에서 허용되는 AI 사용 범위는?","AI 배경 제거 및 배경 생성",["AI로 굿즈 이미지 전체 생성","AI로 굿즈 디자인 변형","AI 사용 일절 금지"],"직접 찍은 사진이라면 AI 배경 제거와 배경 생성은 허용됩니다."],
["활동 정지 1일은 경고 몇 회에 해당하나요?","2회",["1회","3회","5회"],"활동 정지 1일은 경고 2회와 같습니다."],
["잡담 게시판에서 작성 자제를 요청하는 글은?","피해 사실 공유가 아닌 업자·플미 관련 단순 한탄글",["업자 피해 사실 공유글","치이카와 감상글","나가노 작가님 신작 이야기"],"단순 한탄글은 다른 회원의 피로도를 높여 자제를 요청합니다."],
["소형 물품(잡화류)의 대리구매비 상한은?","~2,000원",["~1,000원","~3,000원","~4,000원"],"소형 ~2,000원, 마스코트 ~4,000원, 대형 ~5,000원입니다."],
["마스코트류의 대리구매비 상한은?","~4,000원",["~2,000원","~3,000원","~5,000원"],"마스코트류는 ~4,000원까지입니다."],
["대형 물품의 대리구매비 상한은?","~5,000원",["~4,000원","~6,000원","~10,000원"],"대형 물품은 ~5,000원까지입니다."],
["신고글을 작성할 때 체크해야 하는 설정은?","스태프만 보기",["댓글 허용","전체 공개","공지 등록"],"추가 피해를 막기 위해 스태프만 보기를 체크하고 신고합니다."],
["장난성 신고의 제재는?","3일 정지",["경고 1회","1일 정지","영구 탈퇴"],"장난성 신고는 이의 없이 3일 정지입니다."],
["신고글을 쓴 뒤 임의로 글이나 댓글을 삭제하면?","경고 처리",["제재 없음","영구 탈퇴","신고만 자동 취소"],"원본을 보존해야 하며, 임의 삭제 시 경고 처리됩니다."],
["거래·공구·나눔 후기 게시판에 쓸 수 있는 후기는?","본 카페 내에서 진행된 거래의 후기",["모든 중고 거래 후기","번개장터 거래 후기","공식 스토어 구매 후기"],"본 카페 내에서 진행된 거래에 한해 작성할 수 있습니다."],

["판매가 가능한 최소 등급은?","제초3급",["제초4급","제초5급","랭커"],"판매는 제초3급부터 가능합니다."],
["거래 게시판 외 다른 루트로 거래하면?","활동 정지 7일",["경고 1회","활동 정지 1일","영구 탈퇴"],"다른 루트를 이용한 거래는 활동 정지 7일입니다."],
["거래 중 이유 없이 거래를 파기하면?","경고 1회",["활동 정지 7일","영구 탈퇴","제재 없음"],"신고 확인 후 경고 1회입니다."],
["등급이 부족한 회원이 판매나 공구 모집을 시도하면?","활동 정지 7일",["경고 1회","활동 정지 1일","영구 탈퇴"],"등급 미달 회원의 거래 시도는 활동 정지 7일입니다."],
["판매 게시판에서 쓰는 말머리 조합은?","[판매중] / [완료]",["[판매합니다] / [예약중]","[양도] / [마감]","[소분합니다] / [완료]"],"판매 게시판 말머리는 [판매중]과 [완료]입니다."],

const $ = id => document.getElementById(id);
const nick = $("nick"), startBtn = $("startBtn");
let order = [], pos = 0, tries = 0, current = null, locked = false;

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function nextIndex(){
  if(pos >= order.length){ order = shuffle(Q.map((_,i)=>i)); pos = 0; }
  return order[pos++];
}

nick.addEventListener("input", () => { startBtn.disabled = nick.value.trim().length === 0; });
nick.addEventListener("keydown", e => { if(e.key === "Enter" && !startBtn.disabled) startBtn.click(); });

startBtn.addEventListener("click", () => {
  order = shuffle(Q.map((_,i)=>i)); pos = 0; tries = 0;
  $("start").hidden = true; $("quiz").hidden = false;
  showQuestion();
});

function showQuestion(){
  tries++; locked = false;
  const [q, right, wrongs, exp] = Q[nextIndex()];
  current = {q, right, exp};
  $("qmeta").textContent = tries === 1 ? "문제" : `${tries}번째 도전`;
  $("qtext").textContent = q;
  $("feedback").hidden = true; $("retryBtn").hidden = true;
  const box = $("opts"); box.innerHTML = "";
  shuffle([right, ...wrongs]).forEach(text => {
    const b = document.createElement("button");
    b.className = "opt"; b.type = "button"; b.textContent = text;
    b.addEventListener("click", () => pick(b, text));
    box.appendChild(b);
  });
  box.querySelector(".opt").focus({preventScroll:true});
  window.scrollTo({top:0});
}

function pick(btn, text){
  if(locked) return; locked = true;
  const all = [...$("opts").children];
  all.forEach(b => { b.disabled = true; });
  if(text === current.right){ pass(); return; }
  btn.classList.add("is-picked-wrong");
  all.find(b => b.textContent === current.right).classList.add("is-right");
  $("explain").textContent = current.exp;
  $("feedback").hidden = false; $("retryBtn").hidden = false;
  $("retryBtn").focus();
}
$("retryBtn").addEventListener("click", showQuestion);

function code(){
  const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = "";
  const r = new Uint32Array(6); crypto.getRandomValues(r);
  r.forEach(n => s += c[n % c.length]); return s.slice(0,3) + "-" + s.slice(3);
}

function pass(){
  const now = new Date().toLocaleString("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"long",day:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"});
  $("pNick").textContent = nick.value.trim();
  $("pTime").textContent = now;
  $("pTries").textContent = `${tries}회`;
  $("pCode").textContent = code();
  $("pQ").textContent = current.q;
  $("pA").textContent = current.right;
  $("quiz").hidden = true; $("passed").hidden = false;
  window.scrollTo({top:0});
}
</script>
